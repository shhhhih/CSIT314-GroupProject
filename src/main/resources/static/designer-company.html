<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Company Information | IDP</title><link rel="stylesheet" href="css/shared.css"></head><body><div id="f1-nav"></div><main class="container"><header class="page-head"><div><span class="eyebrow">Your studio</span><h1>Company Information</h1><p class="muted">Help customers learn more about your interior design company.</p></div></header><p id="notice" role="status" class="alert">Loading company information...</p><section class="card"><form id="companyForm"><div class="grid two"><div class="field"><label for="companyName">Company name</label><input id="companyName" name="companyName" maxlength="120" required></div><div class="field"><label for="contact">Contact number</label><input id="contact" name="contact" maxlength="30" required></div><div class="field"><label for="address">Business address</label><input id="address" name="address" maxlength="255" required></div><div class="field"><label for="licenceNumber">Licence number</label><input id="licenceNumber" name="licenceNumber" maxlength="60"></div></div><div class="field"><label for="description">Company description</label><textarea id="description" name="description" maxlength="2000"></textarea></div><div class="actions"><button type="submit" class="btn" id="submit">Save Company Information</button><a href="designer-home.html" class="btn secondary">Back</a></div></form></section></main><script src="js/f1-api.js"></script><script src="js/f1-nav.js"></script><script>
const companyForm=document.getElementById('companyForm');const notice=document.getElementById('notice');let companyExists=false;
(async()=>{try{const c=await f1Request(F1_ENDPOINTS.company);companyExists=true;for(const name of ['companyName','contact','address','licenceNumber','description'])companyForm.elements[name].value=c[name]??'';f1Alert(notice,'Company information loaded.','success');}catch(err){f1Alert(notice,err.message+' If no company exists yet, this form can create it once B2 confirms the API.');}})();
companyForm.addEventListener('submit',async e=>{e.preventDefault();if(!companyForm.reportValidity())return;const btn=document.getElementById('submit');btn.disabled=true;const body=Object.fromEntries(new FormData(companyForm));try{await f1Request(F1_ENDPOINTS.company,{method:companyExists?'PUT':'POST',body:JSON.stringify(body)});companyExists=true;f1Alert(notice,'Company information saved.','success');}catch(err){f1Alert(notice,err.message);}finally{btn.disabled=false;}});
</script></body></html>
