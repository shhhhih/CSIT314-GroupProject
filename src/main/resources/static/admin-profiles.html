<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage User Profiles — IDP</title><style>
:root{--bg:#f6f5f1;--ink:#27352c;--sage:#4f6857;--line:#dfe5dd;--sub:#68786e;--red:#a52d2d}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,Arial,sans-serif}a{color:inherit}header{background:#fff;border-bottom:1px solid var(--line);padding:20px max(22px,5vw);display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.brand{font:700 28px Georgia,serif;color:var(--sage);text-decoration:none}nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap}nav a{text-decoration:none;font-size:14px}nav a:hover{text-decoration:underline}main{max-width:1120px;margin:48px auto;padding:0 22px}.eyebrow{text-transform:uppercase;letter-spacing:.22em;font-size:12px;font-weight:700;color:var(--sage)}h1{font:normal clamp(32px,5vw,54px) Georgia,serif;margin:6px 0 10px}h2{font:normal 27px Georgia,serif;margin:0 0 15px}.muted{color:var(--sub)}.card{border:1px solid var(--line);border-radius:18px;background:#fff;padding:26px;box-shadow:0 6px 20px #27352c08}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:28px}.card-link{display:block;text-decoration:none}.card-link:hover{border-color:var(--sage)}.btn{background:var(--sage);border:1px solid var(--sage);border-radius:10px;padding:11px 16px;color:#fff;font:600 14px system-ui;cursor:pointer}.btn.alt{color:var(--sage);background:#fff}.btn.danger{background:#fff;color:var(--red);border-color:#e8c5c5}.btn:disabled{opacity:.5;cursor:not-allowed}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{display:grid;gap:7px;margin:12px 0}.field label{font-weight:600;font-size:13px}input,textarea{width:100%;padding:11px 12px;border-radius:9px;border:1px solid #cbd6cb;font:inherit}input:focus,textarea:focus{outline:2px solid #b5c8ba}.message{padding:12px 14px;border-radius:10px;background:#edf3ed;margin:18px 0}.message.error{background:#fff0ef;color:#a32626}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--sub)}.pill{display:inline-block;border-radius:99px;padding:4px 11px;background:#e9f3e8;font-size:12px;color:#34543d}.pill.suspended{background:#fae9e8;color:#8b302a}dialog{border:1px solid var(--line);border-radius:16px;width:min(92vw,540px);padding:25px;box-shadow:0 18px 70px #0003}dialog::backdrop{background:#15201985}@media(max-width:600px){main{margin:25px auto}.card{padding:18px}}
</style></head><body><header><a class="brand" href="/admin-home.html">IDP.</a><nav aria-label="Admin navigation"><a href="/admin-home.html">Dashboard</a><a href="/admin-profiles.html">Manage Profiles</a><a href="/profile.html">My Profile</a><button class="btn alt" id="logout" type="button">Log out</button></nav></header><main><p class="eyebrow">User administration</p><h1>Manage user profiles.</h1><p class="muted">These are <strong>role profiles</strong> (Customer, Interior Designer and similar roles), not individual user accounts.</p><div class="card"><div class="controls"><form id="searchForm" class="controls" style="flex:1"><label for="search" class="muted">Search profiles</label><input style="max-width:340px" id="search" placeholder="Name or description"><button class="btn alt" type="submit">Search</button><button class="btn alt" id="clear" type="button">Clear</button></form><button class="btn" id="new" type="button">+ New profile</button></div><p class="message" id="message" role="status" aria-live="polite">Loading profiles…</p><div class="table-scroll"><table><thead><tr><th>ID</th><th>Profile name</th><th>Description</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></main>
<dialog id="editor"><h2 id="dialogTitle">Profile</h2><form id="editorForm"><div class="field"><label for="name">Role name</label><input id="name" maxlength="100" required></div><div class="field"><label for="description">Description</label><textarea id="description" rows="4"></textarea></div><div class="controls" style="justify-content:flex-end"><button class="btn alt" type="button" id="cancel">Cancel</button><button class="btn" type="submit" id="submit">Save profile</button></div></form></dialog>
<script>
document.getElementById('logout').addEventListener('click',async()=>{const b=document.getElementById('logout');b.disabled=true;try{const r=await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'});if(!r.ok)throw new Error('Logout failed ('+r.status+')');location.replace('/guest-home.html')}catch(e){alert(e.message);b.disabled=false}});
</script><script>
const base='/api/admin/profiles', rows=document.getElementById('rows'),msg=document.getElementById('message'),editor=document.getElementById('editor');let selected=null;const $=id=>document.getElementById(id);
function notice(s,error=false){msg.textContent=s;msg.className='message'+(error?' error':'')}
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options});if(r.status===401){location.replace('/login.html');throw Error('Please log in')}const ct=r.headers.get('content-type')||'';const data=ct.includes('json')?await r.json():null;if(!r.ok)throw Error(data?.message||'Request failed ('+r.status+')');return data}
function button(label,cssClass,cb){const b=document.createElement('button');b.type='button';b.className='btn '+cssClass;b.textContent=label;b.addEventListener('click',cb);return b}
async function load(){try{const keyword=$('search').value.trim(),data=await api(base+(keyword?'?keyword='+encodeURIComponent(keyword):''));if(!Array.isArray(data))throw Error('Unexpected profiles response');rows.replaceChildren();for(const p of data){const tr=document.createElement('tr');for(const val of [p.profileId,p.profileName,p.description]){const td=document.createElement('td');td.textContent=val??'';tr.append(td)}const st=document.createElement('td'),badge=document.createElement('span');badge.className='pill'+(p.profileStatus==='SUSPENDED'?' suspended':'');badge.textContent=p.profileStatus;st.append(badge);tr.append(st);const td=document.createElement('td'),wrap=document.createElement('div');wrap.className='controls';wrap.append(button('View','alt',()=>view(p.profileId)),button('Edit','alt',()=>openEditor(p)),button(p.profileStatus==='ACTIVE'?'Suspend':'Activate','danger',()=>changeStatus(p)));td.append(wrap);tr.append(td);rows.append(tr)}notice(data.length+' profile(s) found.')}catch(e){notice(e.message,true)}}
async function view(id){try{const p=await api(base+'/'+encodeURIComponent(id));alert('Role: '+p.profileName+'\nDescription: '+(p.description||'-')+'\nStatus: '+p.profileStatus+'\nCreated: '+(p.createdAt||'-'))}catch(e){notice(e.message,true)}}
function openEditor(p=null){selected=p?.profileId??null;$('dialogTitle').textContent=p?'Edit profile':'Create profile';$('name').value=p?.profileName??'';$('description').value=p?.description??'';editor.showModal()}
$('new').onclick=()=>openEditor();$('cancel').onclick=()=>editor.close();$('searchForm').onsubmit=e=>{e.preventDefault();load()};$('clear').onclick=()=>{$('search').value='';load()};
$('editorForm').onsubmit=async e=>{e.preventDefault();const b=$('submit');b.disabled=true;try{await api(base+(selected!==null?'/'+selected:''),{method:selected!==null?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profileName:$('name').value.trim(),description:$('description').value.trim()})});editor.close();notice('Profile saved.');await load()}catch(err){notice(err.message,true)}finally{b.disabled=false}};
async function changeStatus(p){const next=p.profileStatus==='ACTIVE'?'SUSPENDED':'ACTIVE';if(!confirm('Change '+p.profileName+' to '+next+'? This affects accounts under this role.'))return;try{await api(base+'/'+p.profileId+'/status',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({profileStatus:next})});await load()}catch(e){notice(e.message,true)}}
load();
</script></body></html>
