<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log In - IDP Platform</title>
  <style>
    body { font-family: sans-serif; background: #f4f5f7; margin: 0;
           display: flex; justify-content: center; padding-top: 80px; }
    .card { background: #fff; padding: 32px; border-radius: 8px;
            width: 100%; max-width: 360px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    h1 { margin-top: 0; }
    label { display: block; margin: 16px 0 6px; font-size: 14px; }
    input { width: 100%; padding: 10px; box-sizing: border-box;
            border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; margin-top: 20px; padding: 10px; border: 0;
             border-radius: 4px; background: #2d6cdf; color: #fff; font-size: 16px; cursor: pointer; }
    #message { color: #c0392b; min-height: 20px; margin: 12px 0 0; font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Log In</h1>
    <form id="loginForm" novalidate>
      <label for="identifier">Username or email</label>
      <input id="identifier" type="text" autocomplete="username">

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">

      <p id="message" role="alert"></p>
      <button type="submit">Log In</button>
    </form>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';

      const identifier = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;

      if (!identifier || !password) {
        message.textContent = 'Please enter your username and password';
        return;
      }

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usernameOrEmail: identifier, password: password })
        });
        const data = await response.json().catch(() => ({}));

        if (response.ok) {
          window.location.href = data.redirectUrl;  
        } else {
          message.textContent = data.message || 'Login failed';
        }
      } catch (error) {
        message.textContent = 'Cannot reach the server';
      }
    });
  </script>
</body>
</html>
