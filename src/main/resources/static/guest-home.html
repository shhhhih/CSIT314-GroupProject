<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse Projects | IDP</title>
  <link rel="stylesheet" href="css/shared.css">
  <style>
    :root{--bg:#f7f6f2;--panel:#fff;--ink:#27332c;--muted:#6b786e;--green:#496652;--green-dark:#304a39;--line:#dfe7df;--soft:#edf3ed;--radius:16px}
    *{box-sizing:border-box}
    body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink)}
    a{color:inherit}
    button,input,select{font:inherit}
    button{cursor:pointer}
    h1,h2,h3{font-family:Georgia,serif;font-weight:normal;letter-spacing:-.3px}
    h1{font-size:38px;margin:8px 0}
    h2{font-size:25px;margin:0 0 6px}
    p{line-height:1.65}
    .muted{color:var(--muted)}
    .eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--green)}

    /* Layout */
    .container{max-width:1160px;margin:40px auto;padding:0 24px 60px}
    .page-head{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:28px}
    .page-head p{margin:6px 0}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:0 5px 20px #14271906}
    .empty{text-align:center;padding:42px 20px;color:var(--muted)}

    /* Sign-up banner */
    .banner{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;background:var(--soft);border-color:#cfdcd0;margin-bottom:28px}
    .banner p{margin:0}

    /* Buttons */
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;background:var(--green);color:#fff;text-decoration:none;border:1px solid var(--green);padding:12px 18px;border-radius:9px;font-weight:600}
    .btn:hover{background:var(--green-dark)}
    .btn.secondary{background:#fff;color:var(--green);border-color:var(--line)}
    .btn.secondary:hover{background:var(--soft)}

    /* Search and filters */
    .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:20px}
    .field{margin-bottom:20px}
    .field label{display:block;font-weight:600;font-size:13px;margin-bottom:9px}
    .field input,.field select{width:100%;border:1px solid #cdd9ce;background:#fff;padding:12px 13px;border-radius:9px;color:var(--ink)}
    .field input:focus,.field select:focus{outline:2px solid #b1c5b3;outline-offset:1px}
    .result-count{margin:0 0 16px;font-size:14px}

    /* Project cards */
    .idp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
    .idp-grid>.empty{grid-column:1/-1}
    .idp-card{display:flex;flex-direction:column;padding:0;overflow:hidden;text-decoration:none;transition:transform .15s,border-color .15s}
    .idp-card:hover{transform:translateY(-2px);border-color:#a1b6a5}
    .idp-thumb{aspect-ratio:4/3;width:100%;object-fit:cover;display:block;background:var(--soft)}
    .idp-card-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
    .idp-card h3{font-size:20px;margin:0;line-height:1.3}
    .price{font-weight:600;color:var(--green-dark)}
    .more{margin-top:auto;font-size:14px;color:var(--green);font-weight:600}
    .pill-row{display:flex;gap:6px;flex-wrap:wrap}
    .pill{display:inline-block;border-radius:99px;padding:6px 12px;background:var(--soft);color:var(--green-dark);font-size:12px;font-weight:700}
    .pill.quiet{background:#f3f1ea;color:var(--muted)}

    @media(max-width:760px){.container{margin:25px auto}h1{font-size:30px}.card{padding:20px}.idp-card{padding:0}}
  </style>
</head>
<body>
  <!-- Replaced manual header with f2-nav placeholder for guest role -->
  <div id="f2-nav" data-role="guest"></div>

  <main class="container">
    <header class="page-head">
      <div>
        <span class="eyebrow">Discover</span>
        <h1>Browse Projects</h1>
        <p class="muted">Explore interior design projects from designers across Singapore.</p>
      </div>
    </header>

    <section class="card banner">
      <div>
        <h2>Like what you see?</h2>
        <p class="muted">Create a free account to save projects to your favourites and compare them later.</p>
      </div>
      <div class="actions">
        <a class="btn" href="customer-register.html">Register</a>
        <a class="btn secondary" href="login.html">Log In</a>
      </div>
    </section>

    <form class="toolbar" id="searchForm" role="search">
      <div class="field" style="flex:2;min-width:200px">
        <label for="keyword">Search by keyword</label>
        <input id="keyword" name="keyword" type="search" placeholder="Title, description or category">
      </div>
      <div class="field" style="flex:1;min-width:150px">
        <label for="category">Category</label>
        <select id="category" name="categoryId"><option value="">All categories</option></select>
      </div>
      <div class="field" style="flex:1;min-width:140px">
        <label for="propertyType">Property type</label>
        <select id="propertyType" name="propertyType">
          <option value="">All types</option><option value="HDB">HDB</option><option value="Condominium">Condominium</option><option value="Landed">Landed</option><option value="Commercial">Commercial</option>
        </select>
      </div>
      <div class="field" style="flex:1;min-width:120px">
        <label for="minBudget">Min budget (S$)</label>
        <input id="minBudget" name="minBudget" type="number" min="100" step="50">
      </div>
      <div class="field" style="flex:1;min-width:120px">
        <label for="maxBudget">Max budget (S$)</label>
        <input id="maxBudget" name="maxBudget" type="number" min="100" step="50">
      </div>
      <div class="field"><button class="btn" type="submit">Search</button></div>
      <div class="field"><button class="btn secondary" type="reset">Clear</button></div>
    </form>

    <p class="muted result-count" id="count"></p>

    <section class="idp-grid" id="results" aria-label="Search results">
      <div class="card empty">No projects found</div>
    </section>

  </main>

  <!-- Load the navigation script (adjust path if needed) -->
  <script src="js/f2-nav.js"></script>
</body>
</html>
