<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Projects | IDP</title>
  <link rel="stylesheet" href="css/shared.css">

  <style>
    .project-thumb {
      width: 100px;
      height: 75px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #dfe7df;
      background: #edf3ed;
    }
  </style>
</head><body><div id="f1-nav"></div><main class="container"><header class="page-head"><div><span class="eyebrow">Your portfolio</span><h1>My Projects</h1><p class="muted">Manage your interior design projects.</p></div><a class="btn" href="designer-idp-form.html">+ Create Project</a></header><p id="notice" class="alert" role="status">Loading projects...</p><div class="toolbar"><div class="field" style="flex:2;min-width:180px"><label for="search">Search projects</label><input id="search" placeholder="Search by title"></div><div class="field" style="flex:1;min-width:150px"><label for="filter">Project status</label><select id="filter"><option value="">All</option><option value="Published">Published</option><option value="Ongoing">Ongoing</option></select></div></div><section class="card"><div class="table-wrap"><table class="data-table"><thead><tr><th>Image</th><th>Project</th><th>Category</th><th>Status</th><th>Budget</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">Loading...</td></tr></tbody></table></div></section></main><script src="js/f1-api.js"></script><script src="js/f1-nav.js"></script><script>
const rows=document.getElementById('rows'),notice=document.getElementById('notice');let projects=[];
function textCell(row,value){const td=document.createElement('td');td.textContent=value==null?'—':String(value);row.append(td);return td;}
function render(){rows.replaceChildren();const q=document.getElementById('search').value.trim().toLowerCase(),filter=document.getElementById('filter').value;const shown=projects.filter(p=>(p.title||'').toLowerCase().includes(q)&&(!filter||p.projectStatus===filter));if(!shown.length){const tr=document.createElement('tr'),td=textCell(tr,'No matching projects.');td.colSpan=6;td.className='empty';rows.append(tr);return;}

for(const p of shown){
    const tr=document.createElement('tr');

    const imageCell=document.createElement('td');

    if(p.coverImage){
        const img=document.createElement('img');
        img.src=p.coverImage;
        img.alt=p.title || 'Project image';
        img.className='project-thumb';
        imageCell.appendChild(img);
    }else{
        imageCell.textContent='No image';
    }

    tr.appendChild(imageCell);

    textCell(tr,p.title);
textCell(tr,p.categoryName);textCell(tr,p.projectStatus);textCell(tr,p.budget==null?'—':`S$${Number(p.budget).toLocaleString()}`);const td=document.createElement('td');const edit=document.createElement('a');edit.href=`designer-idp-form.html?id=${encodeURIComponent(p.idpId)}`;edit.textContent='Edit';td.append(edit);const del=document.createElement('button');del.type='button';del.className='btn danger';del.style.marginLeft='12px';del.textContent='Delete';del.addEventListener('click',async()=>{if(!confirm(`Delete ${p.title}?`))return;try{await f1Request(f1IdpPath(p.idpId),{method:'DELETE'});projects=projects.filter(item=>item.idpId!==p.idpId);render();f1Alert(notice,'Project deleted.','success');}catch(e){f1Alert(notice,e.message);}});td.append(del);tr.append(td);rows.append(tr);}}
(async()=>{try{const data=await f1Request(F1_ENDPOINTS.idps);projects=Array.isArray(data)?data:(Array.isArray(data.content)?data.content:[]);f1Alert(notice,`${projects.length} project(s) loaded.`,'success');render();}catch(e){f1Alert(notice,e.message);rows.replaceChildren();}})();
document.getElementById('search').addEventListener('input',render);document.getElementById('filter').addEventListener('change',render);
</script></body></html>
