<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Projects | IDP</title>
    <link rel="stylesheet" href="css/shared.css">
</head>

<body>
    <div id="f1-nav"></div>

    <main class="container">

        <header class="page-head">
            <div>
                <span class="eyebrow">Your portfolio</span>
                <h1>My Projects</h1>
                <p class="muted">
                    Manage your interior design projects.
                </p>
            </div>

            <a class="btn" href="designer-idp-form.html">
                + Create Project
            </a>
        </header>

        <p id="notice" class="alert" role="status">
            Loading projects...
        </p>

        <div class="toolbar">

            <div class="field" style="flex:2;min-width:180px">
                <label for="search">Search projects</label>
                <input id="search" placeholder="Search by title">
            </div>

            <div class="field" style="flex:1;min-width:150px">
                <label for="filter">Project status</label>
                <select id="filter">
                    <option value="">All</option>
                    <option value="Current">Current</option>
                    <option value="Past">Past</option>
                </select>
            </div>

            <div class="field" style="flex:1;min-width:150px">
                <label for="sortBy">Sort projects</label>
                <select id="sortBy">
                    <option value="date">Newest first</option>
                    <option value="oldest">Oldest first</option>
                    <option value="title">Title A-Z</option>
                </select>
            </div>

        </div>

        <section class="card">
            <div class="table-wrap">

                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Project</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Views</th>
                            <th>Shortlists</th>
                            <th>Budget</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="rows">
                        <tr>
                            <td colspan="7" class="empty">
                                Loading...
                            </td>
                        </tr>
                    </tbody>
                </table>

            </div>
        </section>

        <section class="card" id="detailsSection" hidden style="margin-top:24px">

            <h2>Project Details</h2>
            <div id="detailsContent"></div>

            <div class="actions">
                <button id="closeDetails" class="btn secondary" type="button">
                    Close Details
                </button>
            </div>

        </section>

    </main>

    <script src="js/f1-api.js"></script>
    <script src="js/f1-nav.js"></script>

    <script>
        const rows = document.getElementById('rows');
        const notice = document.getElementById('notice');

        const searchInput = document.getElementById('search');
        const filterInput = document.getElementById('filter');
        const sortInput = document.getElementById('sortBy');

        const detailsSection =
            document.getElementById('detailsSection');

        const detailsContent =
            document.getElementById('detailsContent');

        let projects = [];
        let categories = new Map();

        // Create a safe text-only table cell
        function textCell(row, value) {
            const td = document.createElement('td');

            td.textContent =
                value == null ? '—' : String(value);

            row.appendChild(td);
            return td;
        }

        // Display an empty table message
        function showEmpty(message) {
            rows.replaceChildren();

            const tr = document.createElement('tr');
            const td = textCell(tr, message);

            td.colSpan = 7;
            td.className = 'empty';

            rows.appendChild(tr);
        }

        // Get category name from category ID
        function categoryName(project) {
            return categories.get(
                String(project.categoryID)
            ) || '—';
        }

        // Format budget in Singapore dollars
        function formatBudget(value) {
            if (value == null) {
                return '—';
            }

            return 'S$' + Number(value).toLocaleString(
                'en-SG',
                {
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 2
                }
            );
        }

        // US7: Display the designer's IDP list
        function displayMyIDPList() {
            rows.replaceChildren();

            const keyword =
                searchInput.value.trim().toLowerCase();

            const status = filterInput.value;

            const shown = projects.filter(project => {
                const matchesTitle =
                    (project.title || '')
                        .toLowerCase()
                        .includes(keyword);

                const matchesStatus =
                    !status ||
                    (project.projectStatus || '')
                        .toLowerCase() === status.toLowerCase();

                return matchesTitle && matchesStatus;
            });

            if (shown.length === 0) {
                showEmpty(
                    projects.length === 0
                        ? 'You have no projects yet'
                        : 'No matching projects.'
                );
                return;
            }

            for (const project of shown) {
                const tr = document.createElement('tr');

                textCell(tr, project.title);
                textCell(tr, categoryName(project));
                textCell(tr, project.projectStatus);
                textCell(tr, project.viewCount ?? 0);
                textCell(tr, project.shortlistCount ?? 0);
                textCell(tr, formatBudget(project.budget));

                const actions = document.createElement('td');

                // US7: View the selected IDP
                const viewButton =
                    document.createElement('button');

                viewButton.type = 'button';
                viewButton.className = 'btn secondary';
                viewButton.textContent = 'View Details';

                viewButton.addEventListener('click', () => {
                    selectIDP(project.idpID);
                });

                actions.appendChild(viewButton);

                // Preserve existing Edit Project navigation.
                // The team's edit endpoint still needs verification.
                const edit = document.createElement('a');

                edit.href =
                    'designer-idp-form.html?id=' +
                    encodeURIComponent(project.idpID);

                edit.textContent = 'Edit';
                edit.style.marginLeft = '12px';

                actions.appendChild(edit);

                // Existing Delete API is not implemented/verified.
                // Do not offer a destructive action until confirmed.
                const deleteButton =
                    document.createElement('button');

                deleteButton.type = 'button';
                deleteButton.className = 'btn danger';
                deleteButton.textContent = 'Delete';
                deleteButton.style.marginLeft = '12px';
                deleteButton.disabled = true;
                deleteButton.title =
                    'Delete API is not yet available';

                actions.appendChild(deleteButton);

                tr.appendChild(actions);
                rows.appendChild(tr);
            }
        }

        // US7: Load available categories for display
        async function loadCategories() {
            const data = await f1Request(
                F1_ENDPOINTS.idpCategories
            );

            const list = Array.isArray(data)
                ? data
                : (data.categories ?? []);

            categories = new Map(
                list.map(category => [
                    String(category.categoryID ?? category.id),
                    category.categoryName ?? category.name
                ])
            );
        }

        // US7: Retrieve logged-in designer's projects
        async function getMyIDPs() {
            try {
                f1Alert(notice, 'Loading projects...');
                await loadCategories();

                const sortBy = sortInput.value;

                const url =
                    F1_ENDPOINTS.idps +
                    '?sortBy=' +
                    encodeURIComponent(sortBy);

                const data = await f1Request(url);

                projects = Array.isArray(data)
                    ? data
                    : (Array.isArray(data.content)
                        ? data.content
                        : []);

                displayMyIDPList();

                if (projects.length === 0) {
                    f1Alert(notice, 'You have no projects yet');
                } else {
                    f1Alert(
                        notice,
                        projects.length + ' project(s) loaded.',
                        'success'
                    );
                }

            } catch (error) {
                f1Alert(notice, error.message);
                showEmpty('Unable to load projects.');
            }
        }

        // US7: Sort projects by date or title
        async function sortMyIDPs() {
            await getMyIDPs();
        }

        // US7: Select and view one IDP
        async function selectIDP(idpID) {
            try {
                const project = await f1Request(
                    f1IdpPath(idpID)
                );

                displayIDPDetails(project);

            } catch (error) {
                f1Alert(notice, error.message);
            }
        }

        // US7: Display selected project details
        function displayIDPDetails(project) {
            detailsContent.replaceChildren();

            const details = [
                ['Project ID', project.idpID],
                ['Title', project.title],
                ['Category', categoryName(project)],
                ['Description', project.description],
                ['Budget', formatBudget(project.budget)],
                ['Property Type', project.propertyType],
                ['Project Status', project.projectStatus],
                ['View Count', project.viewCount],
                ['Shortlist Count', project.shortlistCount],
                ['Created At', project.createdAt],
                ['Updated At', project.updatedAt]
            ];

            for (const [label, value] of details) {
                const paragraph = document.createElement('p');

                const strong = document.createElement('strong');
                strong.textContent = label + ': ';

                const span = document.createElement('span');
                span.textContent =
                    value == null ? '—' : String(value);

                paragraph.append(strong, span);
                detailsContent.appendChild(paragraph);
            }

            if (Array.isArray(project.images) &&
                project.images.length > 0) {

                const heading = document.createElement('h3');
                heading.textContent = 'Project Images';
                detailsContent.appendChild(heading);

                for (const path of project.images) {
                    if (typeof path !== 'string' ||
                        !/^\/uploads\/[0-9]+\/[a-f0-9-]+\.(jpg|png)$/i.test(path)) {
                        continue;
                    }

                    const image = document.createElement('img');

                    image.src = path;
                    image.alt = project.title || 'Project image';
                    image.loading = 'lazy';
                    image.style.maxWidth = '240px';
                    image.style.margin = '8px';
                    image.style.borderRadius = '8px';

                    detailsContent.appendChild(image);
                }
            }

            detailsSection.hidden = false;
            detailsSection.scrollIntoView({
                behavior: 'smooth',
                block: 'start'
            });
        }

        // Close project details
        document.getElementById('closeDetails')
            .addEventListener('click', () => {
                detailsSection.hidden = true;
            });

        // Search by title
        searchInput.addEventListener(
            'input',
            displayMyIDPList
        );

        // Filter by project status
        filterInput.addEventListener(
            'change',
            displayMyIDPList
        );

        // Sort by date or title
        sortInput.addEventListener(
            'change',
            sortMyIDPs
        );

        // Load projects when page opens
        getMyIDPs();

    </script>
</body>

</html>
