<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | IDP</title>
  <link rel="stylesheet" href="css/shared.css">
  <style>
    :root{--bg:#f7f6f2;--panel:#fff;--ink:#27332c;--muted:#6b786e;--green:#496652;--green-dark:#304a39;--line:#dfe7df;--soft:#edf3ed;--error:#a92727;--radius:16px}
    *{box-sizing:border-box}
    body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
    a{color:inherit}
    button,input{font:inherit}
    button{cursor:pointer}
    [hidden]{display:none!important}
    h1{font-family:Georgia,serif;font-weight:normal;letter-spacing:-.3px;font-size:38px;margin:8px 0}
    p{line-height:1.65}
    .muted{color:var(--muted)}
    .eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--green)}

    /* Layout */
    .container{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px 60px}
    .wrap{width:100%;max-width:520px}
    .back-link{display:inline-flex;gap:8px;color:var(--green);text-decoration:none;font-size:14px;margin-bottom:16px}
    .back-link:hover{text-decoration:underline}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:36px;box-shadow:0 5px 20px #14271906}
    .card-head{margin-bottom:26px}
    .card-head p{margin:6px 0 0}
    .page-foot{max-width:1160px;width:100%;margin:auto;padding:18px 24px 30px;color:var(--muted);font-size:12px;text-align:center}

    /* Form */
    .grid.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
    .field{margin-bottom:20px}
    .field label{display:block;font-weight:600;font-size:13px;margin-bottom:9px}
    .field input{width:100%;border:1px solid #cdd9ce;background:#fff;padding:12px 13px;border-radius:9px;color:var(--ink)}
    .field input:focus{outline:2px solid #b1c5b3;outline-offset:1px}
    .field small{display:block;margin-top:6px;color:var(--muted);font-size:12px}
    .check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-bottom:20px}
    .check input{margin-top:4px;accent-color:var(--green)}

    /* Messages: add class "error" or "success" and remove hidden */
    .alert{padding:12px 16px;border-radius:9px;margin:0 0 18px;font-size:14px}
    .alert.error{color:var(--error);background:#fff2f1;border:1px solid #edcbca}
    .alert.success{color:#22613f;background:#edf8f0;border:1px solid #c5e5d0}

    /* Button and links */
    .btn{display:flex;width:100%;align-items:center;justify-content:center;background:var(--green);color:#fff;border:1px solid var(--green);padding:12px 18px;border-radius:9px;font-weight:600}
    .btn:hover{background:var(--green-dark)}
    .switch{text-align:center;margin:20px 0 0;font-size:14px}
    .switch a{color:var(--green);font-weight:600}

    @media(max-width:760px){.nav-inner{display:block}.nav-links{margin-top:12px}.container{padding:25px 16px 40px}h1{font-size:30px}.card{padding:26px 22px}.grid.two{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <!-- Replaced manual header with f2-nav placeholder for guest role -->
  <div id="f2-nav" data-role="guest"></div>

  <main class="container">
    <div class="wrap">
      <a class="back-link" href="guest-home.html">&larr; Back to browsing</a>

      <section class="card">
        <div class="card-head">
          <span class="eyebrow">Create an account</span>
          <h1>Register</h1>
          <p class="muted">Join as a customer to save the projects you like and compare them later.</p>
        </div>

        <p id="message" class="alert" role="alert" hidden></p>

        <form id="registerForm">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" minlength="3" maxlength="50" autocomplete="username" required>
            <small>3 to 50 characters.</small>
          </div>
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required>
          </div>
          <div class="grid two">
            <div class="field">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
              <small>At least 8 characters.</small>
            </div>
            <div class="field">
              <label for="confirmPassword">Confirm password</label>
              <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
            </div>
          </div>
          <button class="btn" type="submit">Create Account</button>
        </form>

        <p class="switch muted">Already have an account? <a href="login.html">Log in</a></p>
      </section>
    </div>
  </main>
  <footer class="page-foot">IDP Platform</footer>

  <!-- Load the navigation script (adjust path if needed) -->
  <script src="js/f2-nav.js"></script>
</body>
</html>
