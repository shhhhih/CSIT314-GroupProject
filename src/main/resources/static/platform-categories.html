<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IDP Categories | IDP</title>
  <link rel="stylesheet" href="css/shared.css">
  <style>
    :root{--bg:#f7f6f2;--panel:#fff;--ink:#27332c;--muted:#6b786e;--green:#496652;--green-dark:#304a39;--line:#dfe7df;--soft:#edf3ed;--error:#a92727;--radius:16px}
    *{box-sizing:border-box}
    body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink)}
    a{color:inherit}
    button,input{font:inherit}
    button{cursor:pointer}
    h1{font-family:Georgia,serif;font-weight:normal;letter-spacing:-.3px;font-size:38px;margin:8px 0}
    p{line-height:1.65}
    .muted{color:var(--muted)}
    .eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--green)}

    /* Layout */
    .container{max-width:1160px;margin:40px auto;padding:0 24px 60px}
    .page-head{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:28px}
    .page-head p{margin:6px 0}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:0 5px 20px #14271906}

    /* Buttons */
    .btn{display:inline-flex;align-items:center;justify-content:center;background:var(--green);color:#fff;text-decoration:none;border:1px solid var(--green);padding:12px 18px;border-radius:9px;font-weight:600}
    .btn:hover{background:var(--green-dark)}
    .btn.danger{background:#fff;color:var(--error);border-color:#e8c7c7}

    /* Search */
    .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:20px}
    .field{margin-bottom:20px}
    .field label{display:block;font-weight:600;font-size:13px;margin-bottom:9px}
    .field input{width:100%;border:1px solid #cdd9ce;background:#fff;padding:12px 13px;border-radius:9px;color:var(--ink)}
    .field input:focus{outline:2px solid #b1c5b3;outline-offset:1px}

    /* Table */
    .table-wrap{overflow-x:auto}
    .data-table{border-collapse:collapse;width:100%;min-width:600px}
    .data-table th,.data-table td{text-align:left;padding:14px 12px;border-bottom:1px solid var(--line)}
    .data-table th{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
    .empty{text-align:center;padding:42px 20px;color:var(--muted)}
    .row-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

    @media(max-width:760px){.container{margin:25px auto}h1{font-size:30px}.card{padding:20px}}
  </style>
</head>
<body>
  <!-- Replaced manual header with f2-nav placeholder for platform manager role -->
  <div id="f2-nav" data-role="platform"></div>

  <main class="container">
    <header class="page-head">
      <div>
        <span class="eyebrow">Catalogue</span>
        <h1>IDP Categories</h1>
        <p class="muted">Manage the categories designers use to classify their projects.</p>
      </div>
      <a class="btn" href="platform-category-form.html">+ Create Category</a>
    </header>

    <form class="toolbar" role="search">
      <div class="field" style="flex:2;min-width:200px">
        <label for="search">Search categories</label>
        <input id="search" name="keyword" type="search" placeholder="Search by name or description">
      </div>
      <div class="field"><button class="btn" type="submit">Search</button></div>
    </form>

    <section class="card">
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Category</th><th>Description</th><th>Created</th><th>Actions</th></tr></thead>
          
          <tbody id="rows">
            <tr><td colspan="4" class="empty">No categories yet. Create the first one.</td></tr>
          </tbody>
          
        </table>
      </div>
    </section>
  </main>

  <!-- Load navigation script -->
  <script src="js/f2-nav.js"></script>
</body>
</html>
