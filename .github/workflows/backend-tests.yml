name: Spring Boot backend tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_only_ci_password
          MYSQL_DATABASE: idp_platform
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest_only_ci_password"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      DB_USERNAME: root
      DB_PASSWORD: test_only_ci_password
      SPRING_PROFILES_ACTIVE: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven tests
        run: bash ./mvnw test
